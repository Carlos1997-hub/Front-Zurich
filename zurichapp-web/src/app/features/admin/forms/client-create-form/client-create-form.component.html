<form [formGroup]="form" (ngSubmit)="submit()" class="z-form">
  <div class="row g-3">
    <div class="col-12">
      <div class="alert alert-light z-alert mb-0">
        <div class="d-flex align-items-start gap-2">
          <i class="bi bi-person-plus fs-5"></i>
          <div>
            <div class="fw-bold">Crear Cliente + Usuario</div>
            <div class="text-muted small">Captura los datos del cliente y sus credenciales de acceso.</div>
          </div>
        </div>
      </div>
    </div>

    <div class="col-12 col-md-6">
      <label class="form-label">Identificación (10 dígitos)</label>
      <input
        class="form-control"
        formControlName="identificationNumber"
        inputmode="numeric"
        maxlength="10"
        placeholder="1234567890"
        [class.is-invalid]="form.get('identificationNumber')?.touched && form.get('identificationNumber')?.invalid"
      />
      <div class="invalid-feedback">
        Requerido (10 dígitos).
      </div>
    </div>

    <div class="col-12 col-md-6">
      <label class="form-label">Nombre completo</label>
      <input
        class="form-control"
        formControlName="fullName"
        placeholder="Nombre Apellido"
        [class.is-invalid]="form.get('fullName')?.touched && form.get('fullName')?.invalid"
      />
      <div class="invalid-feedback">Requerido.</div>
    </div>

    <div class="col-12 col-md-6">
      <label class="form-label">Email</label>
      <input
        class="form-control"
        formControlName="email"
        placeholder="correo@dominio.com"
        [class.is-invalid]="form.get('email')?.touched && form.get('email')?.invalid"
      />
      <div class="invalid-feedback">Email inválido.</div>
    </div>

    <div class="col-12 col-md-6">
      <label class="form-label">Teléfono</label>
      <input
        class="form-control"
        formControlName="phone"
        inputmode="numeric"
        maxlength="10"
        [class.is-invalid]="form.get('phone')?.touched && form.get('phone')?.invalid"
      />
      <div class="invalid-feedback">Requerido 10 digitos.</div>
    </div>

    <div class="col-12">
      <label class="form-label">Dirección</label>
      <input
        class="form-control"
        formControlName="address"
        placeholder="Calle, número, ciudad"
        [class.is-invalid]="form.get('address')?.touched && form.get('address')?.invalid"
      />
      <div class="invalid-feedback">Requerido.</div>
    </div>

    <div class="col-12">
      <hr class="my-2" />
    </div>

    <div class="col-12 col-md-6">
      <label class="form-label">Usuario (username)</label>
      <input
        class="form-control"
        formControlName="username"
        placeholder="usuario"
        [class.is-invalid]="form.get('username')?.touched && form.get('username')?.invalid"
      />
      <div class="invalid-feedback">Requerido.</div>
    </div>

    <div class="col-12 col-md-6">
      <label class="form-label">Contraseña</label>
      <input
        class="form-control"
        type="password"
        formControlName="password"
        placeholder="Mínimo 6 caracteres"
        [class.is-invalid]="form.get('password')?.touched && form.get('password')?.invalid"
      />
      <div class="invalid-feedback">Mínimo 6 caracteres.</div>
    </div>

    <div class="col-12">
      <label class="form-label">DisplayName (opcional)</label>
      <input class="form-control" formControlName="displayName" placeholder="Nombre a mostrar" />
    </div>

    <div class="col-12">
      <div *ngIf="ok" class="alert alert-success py-2 mb-0">
        <i class="bi bi-check-circle me-2"></i>{{ ok }}
      </div>

      <div *ngIf="error" class="alert alert-danger py-2 mb-0">
        <i class="bi bi-exclamation-triangle me-2"></i>{{ error }}
      </div>
    </div>

    <div class="col-12 d-flex justify-content-end gap-2 mt-1">
      <button type="submit" class="btn btn-zurich" [disabled]="loading">
        <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
        Guardar
      </button>
    </div>
  </div>
</form>
