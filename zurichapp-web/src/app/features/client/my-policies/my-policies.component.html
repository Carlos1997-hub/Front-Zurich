<div class="card z-card">
  <div class="card-header z-card-header d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center gap-3">
      <span class="badge badge-z-accent d-inline-flex align-items-center justify-content-center">
        <i class="bi bi-file-earmark-text"></i>
      </span>

      <div class="d-flex flex-column">
        <span class="z-title">Mis pólizas</span>
        <small class="text-muted">Consulta y seguimiento de tus pólizas</small>
      </div>
    </div>

    <button class="btn btn-outline-brand btn-sm" (click)="load()">
      <i class="bi bi-arrow-clockwise me-1"></i> Recargar
    </button>
  </div>

  <div class="card-body z-card-body">
    <div *ngIf="loading" class="text-muted d-flex align-items-center gap-2">
      <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
      Cargando...
    </div>

    <div *ngIf="error" class="alert alert-danger">
      {{ error }}
    </div>

    <div class="table-responsive" *ngIf="!loading && policies.length">
      <table class="table table-hover align-middle z-table">
        <thead>
          <tr>
            <th style="width:80px;">ID</th>
            <th style="width:160px;">Tipo</th>
            <th style="width:220px;">Inicio</th>
            <th style="width:220px;">Fin</th>
            <th style="width:160px;">Monto</th>
            <th style="width:140px;">Estatus</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let p of policies">
            <td class="z-cell-id">{{ p.policyId }}</td>
            <td class="z-strong">{{ p.policyType }}</td>
            <td class="z-muted">{{ p.startDate }}</td>
            <td class="z-muted">{{ p.expirationDate }}</td>
            <td class="z-strong">{{ p.insuredAmount | number:'1.2-2' }}</td>
            <td>{{ p.policyStatus }}</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div *ngIf="!loading && !policies.length" class="text-muted">
      Aún no tienes pólizas asignadas.
    </div>
  </div>
</div>
